{{- with .Values.controllerApiServerEndpoints }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "connector-bigquery.name" $ }}-api
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ include "connector-bigquery.name" $ }}}
  policyTypes: [Egress]
  egress:
    {{- range . }}
    - to:
        - ipBlock:
            cidr: {{ required "controllerApiServerEndpoints requires a CIDR" .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ required "controllerApiServerEndpoints requires a port" .port }}
    {{- end }}
{{- end }}
