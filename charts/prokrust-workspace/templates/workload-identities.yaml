{{- $accounts := include "workspace.workers" . | fromJsonArray -}}
{{- $storage := .Values.workspace.storage | default dict -}}
{{- $ballistaAccounts := list "prokrust-ballista-scheduler" "prokrust-ballista-executor" -}}
{{- if and $storage (ne .Values.workspace.ballistaAccounts "external") }}{{ $accounts = concat $accounts $ballistaAccounts }}{{ end -}}
{{- range $name := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  {{- if $storage }}
  {{- $isBallista := has $name $ballistaAccounts }}
  {{- $auth := ternary ($storage.ballistaAuth | default dict) $storage.auth $isBallista }}
  {{- $annotations := include "workspace.storageAccountAnnotations" $auth | fromYaml }}
  {{- if $isBallista }}{{ $_ := set $annotations "prokrust.ai/workspace-chart" $.Release.Name }}{{ end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- with $.Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
