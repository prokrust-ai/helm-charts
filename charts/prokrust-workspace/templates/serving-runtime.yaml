{{- define "operator.servingRuntimeObject" -}}
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: prokrust-serving-v1
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
    app.kubernetes.io/name: prokrust
    prokrust.ai/contract: kserve-v2-v1
  annotations:
    prokrust.ai/immutable: "true"
spec:
  disabled: false
  multiModel: false
  protocolVersions: [v2]
  supportedModelFormats:
    - name: prokrust
      version: "1"
      autoSelect: false
  storageHelper:
    disabled: true
  containers:
    - name: kserve-container
      image: {{ include "operator.image" .Values.serving.images.modelServer }}
      imagePullPolicy: {{ .Values.serving.images.modelServer.pullPolicy }}
      ports:
        - {name: h2c, containerPort: 8080, protocol: TCP}
      startupProbe:
        httpGet: {path: /v2/health/ready, port: 8080, scheme: HTTP}
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 120
      readinessProbe:
        httpGet: {path: /v2/health/ready, port: 8080, scheme: HTTP}
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
        successThreshold: 1
      livenessProbe:
        httpGet: {path: /v2/health/live, port: 8080, scheme: HTTP}
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      resources:
        requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 10Gi}
        limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 20Gi}
{{- end -}}
{{- if .Values.serving.enabled -}}
{{- $object := include "operator.servingRuntimeObject" . | fromYaml -}}
{{- $projection := dict "apiVersion" $object.apiVersion "kind" $object.kind "namespace" .Release.Namespace "spec" $object.spec -}}
{{- $digest := printf "sha256:%s" (sha256sum (toJson $projection)) -}}
{{- $_ := set $object.metadata "name" (printf "prokrust-serving-v1-%s" (trunc 12 (trimPrefix "sha256:" $digest))) -}}
{{- $_ := set $object.metadata.annotations "prokrust.ai/content-digest" $digest -}}
{{ toYaml $object }}
{{- end }}
