{{- $access := .Values.connectors.artifactAccess -}}
{{- if $access }}
{{- if not .Values.connectors.enabled }}{{ fail "connectors.artifactAccess requires connectors.enabled" }}{{ end }}
{{- $storage := .Values.workspace.storage | default dict }}
{{- $seen := dict }}
{{- $modes := dict }}
{{- $reserved := concat (include "workspace.workers" . | fromJsonArray) .Values.access.serviceAccounts (list "default" "prokrust-workflow-executor" "prokrust-ballista-executor" "prokrust-ballista-scheduler") }}
{{- range $provider, $binding := $access }}
{{- $account := $binding.serviceAccount }}
{{- $auth := $binding.auth }}
{{- $mode := $auth.provider | default "Secret" }}
{{- $_ := set $modes $mode true }}
{{- if or (hasKey $seen $account.name) (has $account.name $reserved) }}{{ fail (printf "connectors.artifactAccess.%s needs a distinct connector runtime ServiceAccount" $provider) }}{{ end }}
{{- $_ := set $seen $account.name true }}
{{- if and $storage (ne (eq $storage.backend "GCS") (eq $mode "ADC")) }}{{ fail (printf "connectors.artifactAccess.%s auth must match the workspace artifact backend" $provider) }}{{ end }}
{{- range $other := list ($storage.auth | default dict) ($storage.ballistaAuth | default dict) }}
{{- if or (and $auth.roleArn (eq $auth.roleArn $other.roleArn)) (and $auth.secretName (eq $auth.secretName $other.secretName)) }}{{ fail "Connector artifact credentials must be distinct from writer and Ballista credentials" }}{{ end }}
{{- end }}
{{- if and $auth.secretName (not (and (le (len $auth.secretName) 63) (regexMatch "^prokrust-connector-runtime-artifact-[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $auth.secretName))) }}{{ fail "Connector artifact Secret must use the protected prokrust-connector-runtime-artifact- prefix and a DNS label name" }}{{ end }}
{{- if $account.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $account.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "operator.labels" $ | nindent 4 }}
  {{- $annotations := include "workspace.storageAccountAnnotations" $auth | fromYaml }}
  {{- if $auth.gcpServiceAccount }}{{ $_ := set $annotations "iam.gke.io/gcp-service-account" $auth.gcpServiceAccount }}{{ end }}
  {{- with $annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with $.Values.global.imagePullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.connectors.artifactNetworkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prokrust-connector-artifact-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions: [{key: prokrust.ai/connector-uid, operator: Exists}]
  policyTypes: [Egress]
  egress: {{ include "workspace.connectorArtifactEgress" (dict "root" . "modes" $modes) | trim | default "[]" | nindent 4 }}
{{- end }}

{{- end }}

{{- define "workspace.connectorArtifactEgress" -}}
{{- $policy := .root.Values.global.networkPolicy -}}
{{- $store := $policy.artifactStore -}}
{{- if or $store.cidrs $store.podSelector }}
- to:
    {{- range $store.cidrs }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    {{- with $store.podSelector }}
    - podSelector:
        matchLabels: {{ toYaml . | nindent 10 }}
    {{- end }}
  ports: [{protocol: TCP, port: {{ $store.port }}}]
{{- end }}
{{- if and (hasKey .modes "IRSA") $policy.awsAuth.enabled }}
{{- range concat $policy.awsAuth.stsCIDRs .root.Values.awsAuth.stsNetworkCIDRs | uniq }}
- to: [{ipBlock: {cidr: {{ . | quote }}}}]
  ports: [{protocol: TCP, port: 443}]
{{- end }}
{{- end }}
{{- if and (hasKey .modes "EKSPodIdentity") $policy.awsAuth.enabled $policy.awsAuth.podIdentityAgentEnabled }}
- to:
    - ipBlock: {cidr: "169.254.170.23/32"}
    - ipBlock: {cidr: "fd00:ec2::23/128"}
  ports: [{protocol: TCP, port: 80}]
{{- end }}
{{- if and (hasKey .modes "ADC") $policy.gcpAuth.enabled }}
{{- range $policy.gcpAuth.metadataEndpoints }}
- to: [{ipBlock: {cidr: {{ .cidr | quote }}}}]
  ports:
    {{- range .ports }}
    - {protocol: TCP, port: {{ . }}}
    {{- end }}
{{- end }}
{{- range $policy.gcpAuth.googleApiCIDRs }}
- to: [{ipBlock: {cidr: {{ . | quote }}}}]
  ports: [{protocol: TCP, port: 443}]
{{- end }}
{{- end }}
{{- end }}
