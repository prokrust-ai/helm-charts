{{- $system := include "operator.installation" . -}}
{{- $workspace := .Release.Namespace -}}
{{- $name := printf "prokrust-enroll-%s" (sha256sum $workspace | trunc 16) -}}
{{- $image := required "enrollment.image requires an immutable kubectl image" .Values.enrollment.image -}}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) -}}
{{- fail "enrollment.image requires an immutable kubectl image" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $system }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [{{ $workspace | quote }}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $system }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-composition
  namespace: {{ $system }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [prokrust-component-versions]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-composition
  namespace: {{ $system }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-composition}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $system }}}
{{- if .Values.tenantDefaults }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $workspace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - apiGroups: [platform.prokrust.ai]
    resources: [prokrustpolicies, artifactstores, ballistaclusters]
    resourceNames: [default]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $workspace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $system }}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $system }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
  policyTypes: [Ingress, Egress]
  ingress: []
  {{- if .Values.global.networkPolicy.apiServerEndpoints }}
  egress:
    {{- range .Values.global.networkPolicy.apiServerEndpoints }}
    - to: [{ipBlock: {cidr: {{ .cidr | quote }}}}]
      ports: [{protocol: TCP, port: {{ .port }}}]
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $system }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 150
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
    spec:
      {{- include "operator.podPlacement" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: enroll
          image: {{ $image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
{{ .Files.Get "files/enroll.sh" | indent 14 }}
          env:
            - {name: WORKSPACE, value: {{ $workspace | quote }}}
            - {name: INSTALLATION, value: {{ $system | quote }}}
            - {name: WORKSPACE_RELEASE, value: {{ .Release.Name | quote }}}
            - {name: SUPPORTED_SYSTEM_VERSION, value: {{ required "supportedSystemVersion is required" .Values.supportedSystemVersion | quote }}}
            - {name: CHECK_DEFAULTS, value: {{ ternary "true" "false" (not (empty .Values.tenantDefaults)) | quote }}}
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
