          parameter: '{{tasks.candidate.outputs.parameters.artifact-uri}}'
        globalName: artifact-uri
      - name: artifact-digest
        valueFrom:
          parameter: '{{tasks.candidate.outputs.parameters.artifact-digest}}'
        globalName: artifact-digest
