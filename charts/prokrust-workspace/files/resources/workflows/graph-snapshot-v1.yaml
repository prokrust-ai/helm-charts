    - name: data-job-image
    - name: resources-json
  templates:
  - name: pipeline
    failFast: true
    dag:
      tasks:
      - name: verify-inputs
        template: artifact-step
        arguments:
          parameters:
          - name: operation
            value: verify-graph-inputs
          - name: input-uri
            value: "{{workflow.parameters.input-uri}}"
          - name: input-digest
            value: "{{workflow.parameters.input-digest}}"
      - name: materialize-relations
        depends: verify-inputs.Succeeded
        template: materializer-step
        arguments:
          parameters:
          - name: operation
            value: materialize-graph-relations
          - name: input-uri
            value: "{{tasks.verify-inputs.outputs.parameters.artifact-uri}}"
          - name: input-digest
            value: "{{tasks.verify-inputs.outputs.parameters.artifact-digest}}"
      - name: build-arrow
        depends: materialize-relations.Succeeded
        template: artifact-step
        arguments:
          parameters:
          - name: operation
            value: build-graph-arrow
          - name: input-uri
            value: "{{tasks.materialize-relations.outputs.parameters.artifact-uri}}"
          - name: input-digest
            value: "{{tasks.materialize-relations.outputs.parameters.artifact-digest}}"
      - name: conformance
        depends: build-arrow.Succeeded
        template: artifact-step
        arguments:
          parameters:
          - name: operation
            value: verify-graph-conformance
          - name: input-uri
            value: "{{tasks.build-arrow.outputs.parameters.artifact-uri}}"
          - name: input-digest
            value: "{{tasks.build-arrow.outputs.parameters.artifact-digest}}"
      - name: candidate
        depends: conformance.Succeeded
        template: candidate-step
        arguments:
          parameters:
          - name: operation
            value: write-graph-candidate
          - name: input-uri
            value: "{{tasks.conformance.outputs.parameters.artifact-uri}}"
          - name: input-digest
            value: "{{tasks.conformance.outputs.parameters.artifact-digest}}"
    outputs:
      parameters:
      - name: artifact-uri
        valueFrom:
          parameter: "{{tasks.candidate.outputs.parameters.artifact-uri}}"
        globalName: artifact-uri
      - name: artifact-digest
        valueFrom:
          parameter: "{{tasks.candidate.outputs.parameters.artifact-digest}}"
        globalName: artifact-digest
  - name: materializer-step
    serviceAccountName: prokrust-graph-materializer
    activeDeadlineSeconds: 7200
    inputs:
      parameters:
      - name: operation
      - name: input-uri
      - name: input-digest
    outputs: &1
      parameters:
      - name: artifact-uri
        valueFrom:
          path: "/var/run/prokrust/outputs/step-artifact-uri"
      - name: artifact-digest
        valueFrom:
          path: "/var/run/prokrust/outputs/step-artifact-digest"
    retryStrategy: &2
      limit: '2'
      retryPolicy: Always
      expression: asInt(lastRetry.exitCode) == 30 || asInt(lastRetry.exitCode) ==
        31
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    volumes: &3
    - name: artifact-credentials
      secret:
        secretName: "{{workflow.parameters.artifact-credential-secret-name}}"
        defaultMode: 288
    container:
      image: "{{workflow.parameters.data-job-image}}"
      imagePullPolicy: IfNotPresent
      command:
      - "/usr/local/bin/prokrust-data-job"
      args:
      - workflow-step
      - "--operation"
      - "{{inputs.parameters.operation}}"
      - "--producer-step"
      - "{{inputs.parameters.operation}}"
      - "--retry-ordinal"
      - "{{retries}}"
      - "--owner-kind"
      - "{{workflow.parameters.owner-kind}}"
      - "--owner-name"
      - "{{workflow.parameters.owner-name}}"
