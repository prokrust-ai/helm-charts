apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: prokrust-graph-snapshot-v1-85368b7969fd
  namespace: prokrust-dev
  labels:
    app.kubernetes.io/name: prokrust
    prokrust.ai/contract: graph-snapshot-v1
    app.kubernetes.io/part-of: prokrust
    app.kubernetes.io/managed-by: Helm
  annotations:
    prokrust.ai/immutable: 'true'
    prokrust.ai/content-digest: sha256:85368b7969fd5f38ac480e0a7f679cf86df916b2c8167e5e053371a51d3802e7
spec:
  entrypoint: pipeline
  onExit: exit-handler
  serviceAccountName: prokrust-workflow-executor
  automountServiceAccountToken: true
  podSpecPatch: '{"automountServiceAccountToken":true,"containers":[{"name":"main","resources":{{workflow.parameters.resources-json}}}]}'
  podMetadata:
    labels:
      prokrust.ai/workload: product
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  synchronization:
    semaphores:
    - configMapKeyRef:
        name: prokrust-producer-semaphore
        key: limit
  activeDeadlineSeconds: 14400
  parallelism: 2
  archiveLogs: false
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 10m
  arguments:
    parameters:
    - name: owner-kind
    - name: owner-name
    - name: owner-uid
    - name: execution-key
    - name: input-uri
    - name: input-digest
    - name: recovery-ordinal
    - name: artifact-attempt-root
    - name: artifact-auth-mode
    - name: artifact-credential-secret-name
    - name: artifact-access-key-id-key
    - name: artifact-secret-access-key-key
