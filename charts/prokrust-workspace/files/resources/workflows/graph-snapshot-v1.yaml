      - "--artifact-attempt-root"
      - "{{workflow.parameters.artifact-attempt-root}}"
      - "--policy-uid"
      - "{{workflow.parameters.policy-uid}}"
      - "--policy-generation"
      - "{{workflow.parameters.policy-generation}}"
      - "--policy-digest"
      - "{{workflow.parameters.policy-digest}}"
      - "--release-lock-uri"
