      - "--ballista-cluster-uid"
      - "{{workflow.parameters.ballista-cluster-uid}}"
      - "--ballista-cluster-generation"
      - "{{workflow.parameters.ballista-cluster-generation}}"
      - "--ballista-cluster-release"
      - "{{workflow.parameters.ballista-cluster-release}}"
      - "--step-result-path"
      - "/var/run/prokrust/outputs/step-result.json"
      env:
      - name: RP_POD_UID
        valueFrom:
          fieldRef:
            fieldPath: metadata.uid
      - name: RP_WORKFLOW_NAME
        value: "{{workflow.name}}"
      - name: RP_ARTIFACT_AUTH_MODE
        value: "{{workflow.parameters.artifact-auth-mode}}"
      - name: RP_ARTIFACT_ACCESS_KEY_ID_FILE
        value: "/var/run/prokrust/credentials/artifact/{{workflow.parameters.artifact-access-key-id-key}}"
      - name: RP_ARTIFACT_SECRET_ACCESS_KEY_FILE
        value: "/var/run/prokrust/credentials/artifact/{{workflow.parameters.artifact-secret-access-key-key}}"
      - name: RP_ARTIFACT_SESSION_TOKEN_FILE
        value: "/var/run/prokrust/credentials/artifact/{{workflow.parameters.artifact-session-token-key}}"
      - name: RP_ARTIFACT_ENDPOINT
        value: "{{workflow.parameters.artifact-endpoint}}"
      - name: RP_ARTIFACT_REGION
        value: "{{workflow.parameters.artifact-region}}"
      - name: RP_ARTIFACT_FORCE_PATH_STYLE
        value: "{{workflow.parameters.artifact-force-path-style}}"
      securityContext: &4
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
      - name: work
        mountPath: "/var/run/prokrust"
      - name: artifact-credentials
        mountPath: "/var/run/prokrust/credentials/artifact"
        readOnly: true
  - name: artifact-step
    serviceAccountName: prokrust-artifact-writer
    activeDeadlineSeconds: 7200
    inputs:
      parameters:
      - name: operation
      - name: input-uri
      - name: input-digest
    outputs: *1
