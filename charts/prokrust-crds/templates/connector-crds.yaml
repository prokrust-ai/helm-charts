{{- $lock := .Files.Get "files/connector-crds.lock.json" | fromJson -}}
{{- range $provider, $enabled := .Values.features.connectors -}}
{{- if not (hasKey $lock.providers $provider) -}}
{{- fail (printf "Unknown connector CRD feature: %s" $provider) -}}
{{- end -}}
{{- if $enabled -}}
{{- $pin := index $lock.providers $provider -}}
{{- range $name, $file := $pin.files -}}
{{- $path := printf "files/connectors/%s/%s" $provider $name -}}
{{- $body := required (printf "Missing provider CRD: %s" $path) ($.Files.Get $path) -}}
{{- if ne (sha256sum $body) $file.sha256 -}}
{{- fail (printf "Provider CRD differs from its source pin: %s" $path) -}}
{{- end -}}
{{- $crd := $body | fromYaml -}}
{{- $annotations := merge (dict "helm.sh/resource-policy" "keep" "argocd.argoproj.io/sync-options" "Prune=false,Delete=false,ServerSideApply=true" "prokrust.ai/provider-crd-sha256" $file.sha256) (default dict $crd.metadata.annotations) -}}
{{- $_ := set $crd.metadata "annotations" $annotations -}}
---
{{ toYaml $crd }}
{{ end -}}
{{- end -}}
{{- end -}}
