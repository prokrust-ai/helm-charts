apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: prokrust-crdgen
    app.kubernetes.io/name: prokrust
    app.kubernetes.io/part-of: prokrust
  name: prokrustaccessbindings.platform.prokrust.ai
spec:
  group: platform.prokrust.ai
  names:
    kind: ProkrustAccessBinding
    plural: prokrustaccessbindings
    singular: prokrustaccessbinding
  preserveUnknownFields: false
  scope: Namespaced
  versions:
