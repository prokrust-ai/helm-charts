                maxProperties: 1024
                properties:
                  name:
                    maxLength: 253
                    type: string
                required:
                - name
                type: object
            required:
            - providerRef
            - rule
            - serviceAccountRef
            type: object
        required:
        - apiVersion
        - kind
        - metadata
        - spec
        title: ProkrustAccessBinding
        type: object
    served: true
    storage: true
