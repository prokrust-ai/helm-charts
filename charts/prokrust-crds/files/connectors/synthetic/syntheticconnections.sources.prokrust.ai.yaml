apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: syntheticconnections.sources.prokrust.ai
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: sources.prokrust.ai
  scope: Namespaced
  names:
    kind: SyntheticConnection
    plural: syntheticconnections
    singular: syntheticconnection
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Connection spec is immutable
              required: [seed, partitions, rowsPerPartition]
              properties:
                placementTemplateRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                seed: {type: integer, minimum: 0, maximum: 999999}
                partitions: {type: integer, minimum: 1, maximum: 100000}
                rowsPerPartition: {type: integer, minimum: 0, maximum: 100000}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                configDigest: {type: string}
                resolvedConfigRefs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                rootUIDs:
                  type: object
                  additionalProperties: {type: string}
                releasedEpoch: {type: integer, format: int64}
                runtime:
                  type: object
                  properties:
                    serviceName: {type: string}
                    serviceUID: {type: string}
                    deploymentUID: {type: string}
                    port: {type: integer, minimum: 1, maximum: 65535}
                    providerId: {type: string}
                    providerMajor: {type: integer, minimum: 0}
                    protocolMajor: {type: integer, minimum: 1}
                    readyReplicas: {type: integer, minimum: 0}
                    releaseVersions:
                      type: array
                      items: {type: string}
                    admissionEpoch: {type: integer, format: int64}
                    acceptsNewScans: {type: boolean}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
