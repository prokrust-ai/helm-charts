apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: paimonconnections.apache.sources.prokrust.ai
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: apache.sources.prokrust.ai
  scope: Namespaced
  names:
    kind: PaimonConnection
    plural: paimonconnections
    singular: paimonconnection
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Connection spec is immutable
              required: ["storage", "credentialsSecretRef"]
              oneOf: [{"required": ["warehousePath"]}, {"required": ["catalog"]}]
              properties:
                placementTemplateRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 63, pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'}
                storage:
                  type: "object"
                  properties:
                    backend:
                      type: "string"
                      enum: ["s3", "gcs"]
                    bucket:
                      type: "string"
                      minLength: 3
                      maxLength: 63
                    prefix:
                      type: "string"
                      minLength: 0
                      maxLength: 1024
                    expectedPrincipal:
                      type: "string"
                      minLength: 1
                      maxLength: 2048
                    region:
                      type: "string"
                      minLength: 1
                      maxLength: 64
                  required: ["backend", "bucket", "prefix", "expectedPrincipal"]
                credentialsSecretRef:
                  type: "object"
                  properties:
                    name:
                      type: "string"
                      minLength: 1
                      maxLength: 253
                      pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$|^[a-z0-9]$"
                  required: ["name"]
                warehousePath:
                  type: "string"
                  minLength: 0
                  maxLength: 1024
                catalog:
                  type: "object"
                  required: ["endpoint", "policyRef", "allowedNamespaces", "auth"]
                  properties:
                    endpoint:
                      type: "string"
                      minLength: 1
                      maxLength: 2048
                    policyRef:
                      type: "string"
                      minLength: 1
                      maxLength: 128
                      pattern: "^[A-Za-z0-9_-]+$"
                    auth:
                      type: "string"
                      enum: ["anonymous", "bearer"]
                    allowedNamespaces:
                      type: "array"
                      minItems: 1
                      maxItems: 512
                      items:
                        type: "array"
                        minItems: 1
                        maxItems: 1
                        items:
                          type: "string"
                          minLength: 1
                          maxLength: 1024
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                configDigest: {type: string}
                resolvedConfigRefs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                rootUIDs:
                  type: object
                  additionalProperties: {type: string}
                releasedEpoch: {type: integer, format: int64}
                runtime:
                  type: object
                  properties:
                    serviceName: {type: string}
                    serviceUID: {type: string}
                    deploymentUID: {type: string}
                    port: {type: integer, minimum: 1, maximum: 65535}
                    providerId: {type: string}
                    providerMajor: {type: integer, minimum: 0}
                    protocolMajor: {type: integer, minimum: 1}
                    readyReplicas: {type: integer, minimum: 0}
                    releaseVersions:
                      type: array
                      items: {type: string}
                    admissionEpoch: {type: integer, format: int64}
                    acceptsNewScans: {type: boolean}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
