apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gcsconnections.google.sources.prokrust.ai
  annotations:
    helm.sh/resource-policy: keep
spec:
  group: google.sources.prokrust.ai
  scope: Namespaced
  names:
    kind: GCSConnection
    plural: gcsconnections
    singular: gcsconnection
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Connection spec is immutable
                - rule: "(!has(self.authMode) || self.authMode == 'serviceAccountKey') == has(self.credentialsSecretRef)"
                  message: Choose a mounted service account key or workload impersonation
              required: [bucket, prefix, bucketProjectNumber, expectedServiceAccountEmail]
              properties:
                authMode: {type: string, enum: [serviceAccountKey, impersonation]}
                bucket: {type: string, minLength: 3, maxLength: 222, pattern: "^[a-z0-9][a-z0-9._-]*[a-z0-9]$"}
                prefix: {type: string, maxLength: 1024}
                bucketProjectNumber: {type: string, pattern: "^[1-9][0-9]{0,19}$"}
                expectedServiceAccountEmail: {type: string, minLength: 20, maxLength: 254, pattern: "^[a-z0-9][a-z0-9-]*@[a-z0-9][a-z0-9-]*[.]iam[.]gserviceaccount[.]com$"}
                credentialsSecretRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253, pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$|^[a-z0-9]$"}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                configDigest: {type: string}
                resolvedConfigRefs:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                rootUIDs:
                  type: object
                  additionalProperties: {type: string}
                releasedEpoch: {type: integer, format: int64}
                runtime:
                  type: object
                  properties:
                    serviceName: {type: string}
                    serviceUID: {type: string}
                    deploymentUID: {type: string}
                    port: {type: integer, minimum: 1, maximum: 65535}
                    providerId: {type: string}
                    providerMajor: {type: integer, minimum: 0}
                    protocolMajor: {type: integer, minimum: 1}
                    readyReplicas: {type: integer, minimum: 0}
                    releaseVersions:
                      type: array
                      items: {type: string}
                    admissionEpoch: {type: integer, format: int64}
                    acceptsNewScans: {type: boolean}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      lastTransitionTime: {type: string, format: date-time}
