{{- $name := include "connector.name" . -}}
{{- $image := required "controllerImage must be pinned by digest" .Values.controllerImage -}}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" $image) -}}{{ fail "controllerImage must be pinned by digest" }}{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-settings
  namespace: {{ .Release.Namespace }}
data:
  settings.json: {{ include "connector.settings" . | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $name }}}
      annotations:
        prokrust.ai/settings-digest: {{ include "connector.settings" . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ $image | quote }}
          args: [controller]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{ .Values.controllerResources | toJson }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          volumeMounts:
            - {name: settings, mountPath: /etc/prokrust/controller, readOnly: true}
      volumes:
        - name: settings
          configMap: {name: {{ $name }}-settings}
