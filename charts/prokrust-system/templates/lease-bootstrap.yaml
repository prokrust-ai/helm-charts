{{- $namespace := .Values.leaseBootstrap.namespace -}}
{{- $namespaces := list .Release.Namespace -}}
{{- if has $namespace $namespaces -}}
{{- fail "leaseBootstrap.namespace must be outside the system namespace so recovery works with unavailable product admission" -}}
{{- end -}}
{{- $name := printf "prokrust-lease-bootstrap-%s" (.Release.Namespace | sha256sum | trunc 10) -}}
{{- define "operator.bootstrapAnnotations" -}}
{{- if eq .Values.leaseBootstrap.mode "helm" }}
helm.sh/hook: pre-install,pre-upgrade
helm.sh/hook-weight: "-20"
helm.sh/hook-delete-policy: before-hook-creation
{{- else }}
argocd.argoproj.io/sync-wave: "-2"
{{- end }}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "operator.bootstrapAnnotations" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "operator.bootstrapAnnotations" . | nindent 4 }}
data:
  leases.yaml: |
{{- range $target := $namespaces }}
{{- range $lease := list "prokrust-application-controller" "prokrust-ballista-cluster-controller" }}
    ---
    apiVersion: coordination.k8s.io/v1
    kind: Lease
    metadata:
      name: {{ $lease }}
      namespace: {{ $target }}
{{- if eq $.Values.leaseBootstrap.mode "helm" }}
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: {{ $.Release.Name }}
        meta.helm.sh/release-namespace: {{ $.Release.Namespace }}
{{- end }}
    spec: {}
{{- end }}
{{- end }}
{{- range $target := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $target }}
  annotations:
    {{- include "operator.bootstrapAnnotations" $ | nindent 4 }}
rules:
  # Kubernetes cannot restrict create to resourceNames. No other resources allowed.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [prokrust-application-controller, prokrust-ballista-cluster-controller]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $target }}
  annotations:
    {{- include "operator.bootstrapAnnotations" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $namespace }}
{{- end }}
{{- with .Values.crdBundleSha256 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-schema
  annotations:
    {{- include "operator.bootstrapAnnotations" $ | nindent 4 }}
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [licenseactivations.platform.prokrust.ai, prokrustaccessbindings.platform.prokrust.ai]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-schema
  annotations:
    {{- include "operator.bootstrapAnnotations" $ | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-schema}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ $namespace }}}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    {{- include "operator.bootstrapAnnotations" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
{{- range .Values.global.networkPolicy.apiServerEndpoints }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports:
        - {protocol: TCP, port: {{ .port }}}
{{- else }}
    # Same empty API endpoint defaults as controllers: configure for access.
    []
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
{{- if eq .Values.leaseBootstrap.mode "helm" }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- else }}
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
{{- end }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- include "operator.podPlacement" . | nindent 6 }}
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: {{ .Values.leaseBootstrap.image | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # kubectl with a request timeout can skip in-cluster discovery.
              api_host="${KUBERNETES_SERVICE_HOST:?Kubernetes Service host is required}"
              api_port="${KUBERNETES_SERVICE_PORT:?Kubernetes Service port is required}"
              case "$api_host" in *:*) api_host="[$api_host]";; esac
              umask 077
              export KUBECONFIG="$HOME/prokrust-hook-kubeconfig"
              cat > "$KUBECONFIG" <<EOF
              apiVersion: v1
              kind: Config
              current-context: incluster
              clusters:
              - name: local
                cluster:
                  server: "https://$api_host:$api_port"
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              contexts:
              - name: incluster
                context:
                  cluster: local
                  user: hook
              users:
              - name: hook
                user:
                  tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
              if [ -n "$CRD_BUNDLE_SHA256" ]; then
                for crd in licenseactivations.platform.prokrust.ai prokrustaccessbindings.platform.prokrust.ai; do
                  observed="$(kubectl --request-timeout=10s get crd "$crd" \
                    -o 'jsonpath={.spec.scope}{"|"}{.metadata.annotations.prokrust\.ai/crd-bundle-sha256}')" || {
                    echo "Cannot read $crd. Install the compatible prokrust-crds release first." >&2
                    exit 1
                  }
                  if [ "$observed" != "Namespaced|$CRD_BUNDLE_SHA256" ]; then
                    echo "$crd does not match the required Prokrust API schema bundle $CRD_BUNDLE_SHA256." >&2
                    exit 1
                  fi
                done
              fi
{{- if or (ne .Values.leaseBootstrap.mode "helm") .Release.IsUpgrade }}
              # Preserve active holder and renewal fields.
              exec kubectl apply --server-side --field-manager=prokrust-lease-bootstrap -f /config/leases.yaml
{{- end }}
          env:
            - {name: HOME, value: /tmp}
            - {name: CRD_BUNDLE_SHA256, value: {{ .Values.crdBundleSha256 | default "" | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: {{ $name }}}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
