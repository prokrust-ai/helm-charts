{{- $registry := include "operator.connectorRegistry" . | fromJson -}}
{{- if $registry.index }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prokrust-connector-registry-index
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
data:
  registry.json: {{ $registry.index | quote }}
{{- end }}
