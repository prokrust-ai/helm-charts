connectors:
  bigquery:
    enabled: false
  gcs:
    enabled: false
  iceberg:
    enabled: false
  paimon:
    enabled: false
  s3:
    enabled: false
  synthetic:
    enabled: false
global:
  awsRegion: ''
  networkFamily: IPv4
  workloadPlacementProfile: arm64
  imagePullSecrets: []
  dnsServerCIDRs: []
  networkPolicy:
    awsAuth:
      enabled: false
      stsCIDRs: []
      podIdentityAgentEnabled: false
    gcpAuth:
      enabled: false
      metadataEndpoints: []
      googleApiCIDRs: []
    dns:
      namespaceSelector:
        kubernetes.io/metadata.name: kube-system
      podSelector:
        k8s-app: kube-dns
    apiServerEndpoints: []
    sourceStore:
      cidrs: []
      podSelector: {}
      port: 443
    artifactStore:
      cidrs: []
      podSelector: {}
      port: 443
    ballista:
      podSelector:
        app.kubernetes.io/name: ballista-gate
      ports:
      - 50050
      - 50051
      - 50052
    inferenceClientPodSelector:
      prokrust.ai/inference-client: 'true'
  oidc:
    enabled: false
    revision: 1
    providers: {}
    targets: []
    providerEgressCIDRs: []
    allowArtifactHostInspection: false
    redis:
      image: ''
      storage: 2Gi
      storageClassName: ''
images:
  operator:
    repository: ar.prokrust.io/prokrust/operator
    digest: sha256:f0600f2a0552970b788327760f5841688d142d08574edc499b71eb9c02195e8c
    pullPolicy: IfNotPresent
controllers:
  applicationReplicas: 1
  ballistaClusterReplicas: 1
  applicationResources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
      ephemeral-storage: 512Mi
  ballistaClusterResources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
      ephemeral-storage: 512Mi
artifactCredentials:
  authMode: mounted-secret
  workloadIdentity: null
  federation: null
  existingSecret: prokrust-artifact-credentials
  accessKeyIdKey: AWS_ACCESS_KEY_ID
  secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
producerProvenance:
  dataJob:
    version: 0.13.0-rc.1
