apiVersion: v2
name: connectors
description: Bundled optional Prokrust connector controllers
type: application
version: 1.0.0
home: https://github.com/prokrust-ai/helm-charts/tree/main/charts/prokrust-system
sources:
- https://github.com/prokrust-ai/helm-charts/tree/main/charts/prokrust-system
dependencies:
- name: connector-bigquery
  alias: bigquery
  version: 1.5.0-rc.1
  condition: bigquery.enabled
  repository: oci://ar.prokrust.io/charts
- name: connector-gcs
  alias: gcs
  version: 1.4.0-rc.1
  condition: gcs.enabled
  repository: oci://ar.prokrust.io/charts
- name: connector-iceberg
  alias: iceberg
  version: 1.4.0-rc.1
  condition: iceberg.enabled
  repository: oci://ar.prokrust.io/charts
- name: connector-paimon
  alias: paimon
  version: 1.4.0-rc.1
  condition: paimon.enabled
  repository: oci://ar.prokrust.io/charts
- name: connector-s3
  alias: s3
  version: 1.4.0-rc.1
  condition: s3.enabled
  repository: oci://ar.prokrust.io/charts
- name: connector-synthetic
  alias: synthetic
  version: 1.4.0-rc.1
  condition: synthetic.enabled
  repository: oci://ar.prokrust.io/charts
